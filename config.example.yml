server:
  host: "0.0.0.0"
  port: 8010

lightpanda:
  bin_path: "lightpanda"
  wait_ms: 2000
  obey_robots: false

fetch:
  timeout: 30
  capacity_wait_timeout: 5
  max_concurrent: 5
  default_return_type: "markdown"
  block_private_networks: true
  max_response_size: 10485760
  v8_max_heap_mb: 256

search:
  default_engine: "duckduckgo"
  default_format: "json"
  default_num_results: 5
  timeout: 20
  capacity_wait_timeout: 5
  max_concurrent: 10
  tavily_api_key: ""
  brave_api_key: ""
  serpapi_api_key: ""

mcp:
  enabled: true
  path: "/mcp"
  allowed_hosts:
    - "localhost"
    - "localhost:*"
    - "127.0.0.1"
    - "127.0.0.1:*"
  allowed_origins: []

tokens:
  - token: "sk-your-token-here"
    name: "example"
