server:
  host: "0.0.0.0"
  port: 8000

lightpanda:
  bin_path: "lightpanda"
  wait_ms: 2000
  obey_robots: false

fetch:
  timeout: 30
  max_concurrent: 5

search:
  default_engine: "duckduckgo"
  default_format: "json"
  default_num_results: 5
  tavily_api_key: ""
  brave_api_key: ""
  serpapi_api_key: ""

tokens:
  - token: "your-token-here"
    name: "example"
