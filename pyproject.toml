[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_web_capability = ["mcp-prompt.md", "static/*.html"]

[project]
name = "agent-web-capability"
version = "0.3.0"
description = "Web capability API for AI agents — fetch and search the web via Lightpanda headless browser and multiple search providers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.0",
    "ddgs>=8.0",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.7"]
brave = ["brave-search-python-client>=0.4"]
serpapi = ["serpapi>=1.0"]
all = ["agent-web-capability[tavily,brave,serpapi]"]

[project.scripts]
awc = "agent_web_capability.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
